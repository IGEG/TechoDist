# =============================================================================
# Prometheus — сбор метрик сервисов Techodist (ADR 0008).
#
# Сервисы в dev запускаются на хосте (`dotnet run`) и отдают /metrics по портам
# из launchSettings.json, поэтому цели — host.docker.internal:<порт>. Prometheus
# работает в контейнере, и для Linux-хостов псевдоним host.docker.internal задан
# в docker-compose.observability.yml (extra_hosts: host-gateway).
#
# Если сервисы поднимаются в контейнерах (Фаза 10), замените адрес цели
# на имя сервиса внутри сети (например, http://catalog-api:8080/metrics).
#
# Проверка конфигурации: promtool check config prometheus.yml
# =============================================================================
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: development

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Путь скрейпа у всех сервисов один (/metrics — эндпоинт OpenTelemetry-экспортёра),
# поэтому он задан значением по умолчанию Prometheus, а интервалы — в global выше.
# Экспортёр OTel в формате Prometheus не кладёт в ряд идентификатор сервиса (ни
# service_name, ни target_info), поэтому имя сервиса проставляет сам скрейп —
# лейбл service в static_configs, и по нему фильтруют алерты и дашборды.
scrape_configs:
  # Порты сервисов (launchSettings.json): gateway 5100, catalog 5101, identity 5102,
  # basket 5103, order 5104, notification 5105, search 5106.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    static_configs:
      - targets: ["host.docker.internal:5100"]
        labels:
          service: api-gateway

  - job_name: catalog-api
    static_configs:
      - targets: ["host.docker.internal:5101"]
        labels:
          service: catalog-api

  - job_name: identity-api
    static_configs:
      - targets: ["host.docker.internal:5102"]
        labels:
          service: identity-api

  - job_name: basket-api
    static_configs:
      - targets: ["host.docker.internal:5103"]
        labels:
          service: basket-api

  - job_name: order-api
    static_configs:
      - targets: ["host.docker.internal:5104"]
        labels:
          service: order-api

  - job_name: notification-api
    static_configs:
      - targets: ["host.docker.internal:5105"]
        labels:
          service: notification-api

  - job_name: search-api
    static_configs:
      - targets: ["host.docker.internal:5106"]
        labels:
          service: search-api
